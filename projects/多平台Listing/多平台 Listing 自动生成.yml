    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 自动识别产品基础信息；必要时调用 Brave Web Search 仅核实品牌官网参数
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_config:
          jinja2_variables: []
        prompt_template:
        - id: 1779902000002-system
          role: system
          text: "你是一位电商 Listing 资料整理专家。请从上传文件文本和用户手填补充中抽取商品信息，输出严格 JSON，不要 markdown 代码块。\n\n=== 搜索增强（有 Brave Search 工具时优先执行）===\n\
            如果产品名称包含可识别的品牌+型号（如 iPhone 15 Pro Max、Samsung Galaxy S24、Dyson V15 等），执行：\n1. 使用 Brave Search 搜索 \"{产品名} official\
            \ specifications site:{品牌官网域名}\"，优先命中品牌官网（apple.com / samsung.com / sony.com 等）\n2. 只使用来自品牌官网的规格数据，第三方评测、电商平台参数页一律忽略\n\
            3. 将搜索到的官方参数放入 verified_facts，key 前加前缀 \"[搜索核实]\"，例如 \"[搜索核实] 电池\": \"3274 mAh\"\n4. 无法确认来源为品牌官网时，不放入 verified_facts\n\
            \n=== 抽取规则 ===\n1. 手填字段优先级 > 文件内容 > 搜索结果；手填非空时必须采用手填值。\n2. 文件可能是 Word、Excel、CSV、TXT、PDF 或竞品 Listing，字段名不固定，请根据语义识别。\n\
            3. platforms 如果文件和手填都没有，默认使用 \"Amazon,淘宝,京东,ebay,速卖通,独立站\"。\n4. keywords 输出逗号分隔字符串，优先保留文件里的核心搜索词；没有时根据产品信息生成 5-10\
            \ 个。\n5. 不要编造确定性硬参数；不确定的信息放进 product_desc 里的\"待确认\"说明。\n6. 如果文件里出现 Shopify、WooCommerce、Brand Website、官网、自建站、品牌官网，platforms\
            \ 统一归为\"独立站\"。\n7. verified_facts 只允许三类来源：(a) 上传文件明确出现的参数 (b) 用户已核实 JSON 中的参数 (c) 搜索到的品牌官网参数（加 [搜索核实] 前缀）；禁止基于常识、推断或训练知识补全。\n\
            8. 输出字段必须完整：\n{\n  \"product_name\": \"...\",\n  \"product_desc\": \"...\",\n  \"keywords\": \"...\",\n  \"target_audience\"\
            : \"...\",\n  \"platforms\": \"Amazon,淘宝,京东,ebay,速卖通,独立站\",\n  \"verified_facts\": {\"字段名\": \"已核实值\", \"[搜索核实]\
            \ 字段名\": \"官网数值\"}\n}"
        - id: 1779902000002-user
          role: user
          text: '【上传文件提取文本】

            {{#1779902000001.text#}}


            【用户手填补充/覆盖】

            产品名称：{{#1779898038871.product_name#}}

            产品描述：{{#1779898038871.product_desc#}}

            核心关键词：{{#1779898038871.keywords#}}

            目标人群：{{#1779898038871.target_audience#}}

            平台列表：{{#1779898038871.platforms#}}

            已核实商品参数 JSON：{{#1779898038871.verified_specs_json#}}'
        selected: false
        title: 资料字段识别 + Brave核实
        tools:
        - provider_id: langgenius/brave/brave
          provider_name: langgenius/brave/brave
          provider_type: builtin
          tool_label: Brave Search
          tool_name: brave_search
          tool_parameters: {}
        type: llm
        vision:
          enabled: false
      height: 116
      id: '1779902000002'
      position:
        x: -360
        y: 220
      positionAbsolute:
        x: -360
        y: 220
