        desc: 产品分析
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_config:
          jinja2_variables: []
        prompt_template:
        - edition_type: basic
          id: d22124fc-be1d-4f24-aa1a-047a4d1773c0
          role: system
          text: "你是一位资深电商选品分析师。请根据以下产品信息，提炼出 5-8 个核心卖点角度，输出为 JSON：\n\n要求：\n1. 卖点必须区分\"功能卖点\"和\"情感卖点\"\n2. 每个卖点给出\"消费者痛点\"\
            和\"产品解决方案\"\n3. 输出严格 JSON 格式，不要 markdown 代码块：\n{\n  \"angles\": [\n    {\"type\": \"功能\", \"pain_point\": \"...\"\
