            brand_risk: {{#1779899961694.item.brand_risk#}}

            strategy_mode: {{#1779899961694.item.strategy_mode#}}


            === 全局治理规则 ===

            1. 只输出当前平台一个区块，输出中只能出现一次【平台】{{#1779899961694.item.platform#}}。

            2. 禁止输出内部推理、任务分析、自我审查、"用户需要我"、"我们分析"、"以下是"、"根据资料"等开场。

            3. 只能使用 Canonical Product Schema 和允许声明清单里的事实；禁止编造未提供的硬件参数、具体数字、库存、销量、价格、认证、保修、物流时效、官方授权、赠品、优惠、平台背书；禁止 Best/No.1/#1/Perfect/Ultimate/Guaranteed/100%/Genuine/Authentic/Original/Official/FDA
            Approved/Medical Grade/Military Grade/Waterproof 等高风险词，除非证据包明确允许。

            4. 允许对已知卖点做中性展开：可以把"全天续航"写成 all-day battery life，可以把"4800万像素主摄"写成 48MP main camera，可以说明面向已知受众的使用场景；但禁止新增具体时长、深度、制程、百分比、版本、年份、尺寸、重量、屏幕尺寸、视频规格、镜头数量、额外功能名。

            5. 不要把 To be confirmed / Unknown / N/A / TBD / Placeholder 当正文填充。缺失但影响发布的信息，只在【运营补充项】提示人工补充；eBay 也不得在公开 Item Specifics
            输出占位行。

            6. 品牌治理：允许品牌字段为「{{#1779899961694.item.allowed_brand#}}」。只有该字段非空时才能输出品牌名；关键词、型号或搜索暗示不等于品牌授权。

            7. 风格不得串台：Amazon/eBay/速卖通禁止淘宝口吻；淘宝禁止 Amazon bullet 风；京东禁止独立站营销长文；独立站禁止平台卖家口吻。

            8. 商标策略：brand_mode=official 时允许使用品牌与官方功能名；brand_mode=generic 时必须按 Trademark Guard 替换或删除；brand_mode=placeholder
            时不应生成平台文案。

            9. 每个卖点只能按 Claim Verification 的 allowed_phrases 展开，禁止使用 forbidden_expansions。

            10. 严格执行缺字段策略：所有平台都不要输出公开 TBC/Unknown/N/A/TBD/Placeholder；缺失字段只进【运营补充项】或总 QA。

            11. 如果 strategy_mode=official_brand，使用 Canonical Product Schema 并保持品牌、型号、JSON-LD 与正文一致；不得写“去品牌化/商标替换/已替换品牌词”等说明。

            12. 如果 strategy_mode=white_label，只能使用 Generic Schema 和白牌化后的产品信息；禁止保留品牌识别锚点，不要写 Phone 15 Pro Max/A17 Pro/Dynamic
            Island/iPhone/Apple。

            13. 【运营补充项】统一放入运营发布前需补充的内容：实际售价、库存数量、发货地、物流方案、保修政策、配件清单、商品颜色、实拍图片、网络锁状态、地区兼容性；禁止将这些信息穿插进正文；禁止提及内部规则、策略名称、AI 或
            QA。

            14. 字段可信度优先级高于文案风格：Trusted Fields 中 state=forbidden/missing/needs_review 的字段不得进入公开正文；style tags 只能改变表达方式，不能新增事实。

            15. SAFE_MARKETING 词只可用于正文/Bullet，不可进入标题、核心参数或 JSON-LD；INFERRED 词如 lightweight、ultra-thin、professional-grade、gaming
            performance 未验证时禁止输出。


