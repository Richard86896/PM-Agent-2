          \        if re.search(pattern, text, flags=re.I):\n            return value\n    return None\n\n\n\ndef detect_product_category(text):\n\
          \    t = text.lower()\n    if any(k in t for k in [\"keyboard\", \"键盘\", \"keycap\", \"hot-swap\", \"热插拔\", \"mechanical\"\
