          \ in REASONING_PATTERNS:\n        text = re.sub(pattern, \"\", text)\n    first_platform = re.search(r\"(?m)^【平台】\\\
          s*.+?\\s*$\", text)\n    if first_platform:\n        text = text[first_platform.start():]\n    text = truncate_to_first_platform_block(text)\n\
          \    for pattern, replacement in RISKY_REPLACEMENTS:\n        text = re.sub(pattern, replacement, text, flags=re.I)\n\
          \    if brand_mode != \"official\":\n        text = remove_unallowed_brand(text, allowed_brand)\n    text = apply_trademark_guard(text,\
          \ trademark_guard, allowed_brand, brand_mode)\n    text = apply_claim_controls(text, claim_controls)\n    text =\
          \ sanitize_jsonld(text, allowed_brand)\n    text = apply_missing_field_strategy(text)\n    text = re.sub(r\"(?m)^\\\
          s*接口信息待确认\\s*(?:and|和)?\\s*supported\\.?\\s*$\", \"接口信息待确认。\", text)\n    text = re.sub(r\"[ \\t]{2,}\", \" \",\
          \ text)\n    text = re.sub(r\"[，,。；;：:]\\s*([，,。；;：:])\", r\"\\1\", text)\n    text = re.sub(r\"[ \\t]+\\n\", \"\
          \\n\", text)\n    text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n    return text.strip()\n\n\ndef find_reasoning_leaks(text):\n\
          \    keywords = [\"检查字符数\", \"我是否应该\", \"重新修改\", \"这样合规\", \"现在输出\", \"注意：我\", \"用户需要我\", \"我们分析\", \"我看看\", \"\
          should I\", \"now output\"]\n    return [k for k in keywords if re.search(re.escape(k), text, flags=re.I)]\n\n\n\
          def strip_style_notes(text):\n    return re.sub(r\"(?ms)^【运营补充项】.*?$(?=^【平台】|\\Z)\", \"\", text)\n\n\ndef find_forbidden_claims(text):\n\
          \    body = strip_style_notes(text)\n    hits = []\n    for claim in FORBIDDEN_CLAIMS:\n        if not re.search(re.escape(claim),\
          \ body, flags=re.I):\n            continue\n        # Neutral seller-confirmation phrasing is allowed; promises\
          \ are not.\n        if claim in {\"赠品\", \"Warranty\"} and re.search(r\"(?:确认|核对|补充|check|confirm|subject to|policy)\"\
          , body, flags=re.I):\n            continue\n        hits.append(claim)\n    return hits\n\n\ndef find_brand_leakage(text,\
          \ allowed_brand=\"\", brand_mode=\"\"):\n    if brand_mode == \"official\" or str(allowed_brand or \"\").strip():\n\
          \        return []\n    hits = [term for term in BRAND_LEAKAGE_TERMS if re.search(re.escape(term), text, flags=re.I)]\n\
          \    if not str(allowed_brand or \"\").strip():\n        for term in BRAND_TERMS:\n            if re.search(re.escape(term),\
          \ text, flags=re.I):\n                hits.append(f\"未授权品牌字段：{term}\")\n    return hits\n\n\ndef find_risky_numbers(text,\
          \ source_numbers=\"\"):\n    allowed = set(DEFAULT_SAFE_NUMBERS) | set(re.findall(r\"\\d+(?:\\.\\d+)?\", source_numbers\
          \ or \"\"))\n    numbers = set(re.findall(r\"(?<![A-Za-z0-9])\\d+(?:\\.\\d+)?\\s*(?:nm|小时|h|H|英寸|寸|GB|G|MP|万|%|倍|Hz|mAh|W|年|天|分钟|米|meters?)?\"\
          , text))\n    risky = []\n    for raw in numbers:\n        value = re.match(r\"\\d+(?:\\.\\d+)?\", raw).group(0)\n\
          \        if value not in allowed:\n            risky.append(raw.strip())\n    return sorted(set(risky))\n\n\ndef\
          \ qa_listing(original, cleaned, source_numbers=\"\", allowed_brand=\"\", trademark_guard=\"\", claim_controls=\"\
          \", brand_mode=\"\"):\n    platform = extract_platform(cleaned or original)\n    issues = []\n    reasoning = find_reasoning_leaks(original)\n\
          \    if reasoning:\n        issues.append(\"已清理非正文分析内容\")\n    forbidden = find_forbidden_claims(cleaned)\n    if\
          \ forbidden:\n        issues.append(\"仍含高风险声明，发布前必须核对来源：\" + \"、\".join(sorted(set(forbidden))))\n    brands_original\
          \ = find_brand_leakage(original, allowed_brand, brand_mode)\n    brands_cleaned = find_brand_leakage(cleaned, allowed_brand,\
          \ brand_mode)\n    if brands_original and not brands_cleaned:\n        issues.append(\"未授权品牌字段已自动清理\")\n    elif\
          \ brands_cleaned:\n        issues.append(\"可能存在第三方品牌/平台背书风险：\" + \"、\".join(sorted(set(brands_cleaned))))\n    numbers\
          \ = find_risky_numbers(cleaned, source_numbers)\n    if numbers:\n        issues.append(\"出现需核对来源的数字/规格：\" + \"\
          、\".join(numbers))\n    if re.search(r\"(?i)placeholder\\.com|example\\.com|InStock|3\\s*nm|29\\s*hours|6\\s*meters|USB[-\
          \ ]?C|Smart HDR|eSIM\", original) and not re.search(r\"(?i)placeholder\\.com|example\\.com|InStock|3\\s*nm|29\\\
          s*hours|6\\s*meters|USB[- ]?C|Smart HDR|eSIM\", cleaned):\n        issues.append(\"已清理未核实参数或占位字段\")\n    return\
          \ platform, issues\n\n\ndef classify_issue(issue):\n    if re.search(r\"第三方品牌|平台背书|未授权品牌字段\", issue):\n        return\
          \ \"P0\"\n    if re.search(r\"高风险声明|数字/规格|保修|物流|库存|Condition|carrier|兼容\", issue, flags=re.I):\n        return \"\
          P1\"\n    if re.search(r\"未核实参数|占位字段|重复平台|SKU|颜色|图片|尺寸|重量|包装\", issue):\n        return \"P2\"\n    return \"P2\"\
          \n\n\ndef compute_qa_status(all_issues, risk_level=\"\", risk_score=0):\n    severities = [classify_issue(issue)\
          \ for _, issues in all_issues for issue in issues]\n    if str(risk_level).lower() == \"high\" or int(risk_score\
          \ or 0) >= 65 or \"P0\" in severities:\n        return \"BLOCKED\"\n    if \"P1\" in severities or str(risk_level).lower()\
          \ == \"medium\" or int(risk_score or 0) >= 30:\n        return \"WARNING\"\n    if \"P2\" in severities:\n     \
          \   return \"READY_WITH_REVIEW\"\n    return \"READY\"\n\n\ndef format_qa_report(all_issues, qa_status=\"READY\"\
          , risk_score=0):\n    lines = [\"## QA 合规检查\", \"\", f\"- status: {qa_status}\", f\"- risk_score: {int(risk_score\
          \ or 0)}\", \"\"]\n    if not all_issues:\n        lines.append(\"- 已完成基础合规复核。仍建议发布前人工复核价格、库存、物流、保修、授权、赠品等信息。\"\
          )\n        return \"\\n\".join(lines)\n    lines.append(\"以下问题需要发布前人工复核：\")\n    lines.append(\"\")\n    for platform,\
          \ issues in all_issues:\n        lines.append(f\"### {platform}\")\n        for issue in issues:\n            lines.append(f\"\
          - {classify_issue(issue)}: {issue}\")\n        lines.append(\"\")\n    return \"\\n\".join(lines).strip()\n\n\n\
          def main(listings: list, source_numbers: str = \"\", allowed_brand: str = \"\", can_generate: bool = True, preflight_report:\
          \ str = \"\", trademark_guard: str = \"\", claim_controls: str = \"\", missing_field_strategies: str = \"\", brand_mode:\
          \ str = \"\", brand_risk: str = \"\", risk_level: str = \"\", risk_score: int = 0):\n    if not can_generate:\n\
          \        report = str(preflight_report or \"# Preflight Validation\\n\\n❌ 未通过：缺少必要字段。\")\n        md = \"# 多平台 Listing\
          \ 生成中断\\n\\n\" + report + \"\\n\"\n        return {\"result\": md, \"qa_report\": \"status: BLOCKED\\n预检未通过，已中断生成。\"\
          , \"qa_status\": \"BLOCKED\"}\n\n    cleaned_by_platform = {}\n    all_issues = []\n\n    for item in listings:\n\
          \        original = str(item or \"\")\n        cleaned = clean_listing(original, allowed_brand, trademark_guard,\
          \ claim_controls, brand_mode)\n        if not cleaned:\n            continue\n        platform, issues = qa_listing(original,\
          \ cleaned, source_numbers, allowed_brand, trademark_guard, claim_controls, brand_mode)\n        if platform in cleaned_by_platform:\n\
          \            issues.append(\"重复平台输出已去重：仅保留第一份内容\")\n        else:\n            cleaned_by_platform[platform] = cleaned\n\
          \        if issues:\n            all_issues.append((platform, issues))\n\n    cleaned_items = list(cleaned_by_platform.values())\n\
          \    qa_status = compute_qa_status(all_issues, risk_level, risk_score)\n    qa_report = format_qa_report(all_issues,\
          \ qa_status, risk_score)\n\n    md = \"# 多平台 Listing 文案汇总\\n\\n\"\n\n    for item in cleaned_items:\n        md\
          \ += item + \"\\n\\n---\\n\\n\"\n\n    return {\"result\": md, \"qa_report\": qa_report, \"qa_status\": qa_status}\n"
