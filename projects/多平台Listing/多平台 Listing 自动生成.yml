      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\nimport re\n\n\nDEFAULT_PLATFORMS = \"Amazon,淘宝,京东,ebay,速卖通,独立站\"\nBRAND_KEYS = {\"brand\", \"\
          品牌\", \"manufacturer\", \"maker\", \"牌子\", \"商品品牌\", \"品牌名\", \"商品牌名\"}\n\n\ndef _clean(value):\n    if value is\
          \ None:\n        return \"\"\n    return str(value).strip()\n\n\ndef _parse_json(text):\n    text = _clean(text)\n\
          \    if not text:\n        return {}\n    text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text, flags=re.I\
          \ | re.S).strip()\n    try:\n        return json.loads(text)\n    except Exception:\n        match = re.search(r\"\
          \\{.*\\}\", text, flags=re.S)\n        if match:\n            try:\n                return json.loads(match.group(0))\n\
          \            except Exception:\n                return {}\n    return {}\n\n\ndef _flatten_facts(value):\n    if\
          \ isinstance(value, dict):\n        facts = {}\n        for k, v in value.items():\n            if isinstance(v,\
          \ (dict, list)):\n                facts[str(k)] = json.dumps(v, ensure_ascii=False)\n            elif v is not None\
          \ and str(v).strip():\n                facts[str(k)] = str(v).strip()\n        return facts\n    return {}\n\n\n\
          def _facts_to_text(facts):\n    if not facts:\n        return \"未提供已核实商品参数。除产品资料明确出现的信息外，禁止补全参数。\"\n    return \"\
          \\n\".join(f\"- {k}: {v}\" for k, v in facts.items())\n\n\ndef _source_numbers(*texts):\n    joined = \"\\n\".join(_clean(t)\
          \ for t in texts if _clean(t))\n    nums = sorted(set(re.findall(r\"\\d+(?:\\.\\d+)?\", joined)))\n    return \"\
          ,\".join(nums)\n\n\ndef _allowed_brand(facts):\n    for key, value in facts.items():\n        key_text = str(key).strip()\n\
          \        if key_text.lower() in BRAND_KEYS or key_text in BRAND_KEYS:\n            return _clean(value)\n    joined\
          \ = \"\\n\".join(f\"{k}: {v}\" for k, v in facts.items())\n    # Only infer from verified facts / official-search\
          \ facts, never from keywords or product name alone.\n    if re.search(r\"\\bApple\\b|苹果\", joined, flags=re.I):\n\
          \        return \"Apple\"\n    return \"\"\n\n\n\ndef _section(text, name):\n    text = _clean(text)\n    if not\
          \ text:\n        return \"\"\n    pattern = rf\"【{re.escape(name)}】\\s*\\n(.*?)(?=\\n【|\\Z)\"\n    match = re.search(pattern,\
          \ text, flags=re.S)\n    return match.group(1).strip() if match else \"\"\n\n\ndef _file_data(document_text):\n\
          \    text = _clean(document_text)\n    if not text:\n        return {}\n    data = {\n        \"product_name\":\
          \ _section(text, \"产品名称\"),\n        \"product_desc\": _section(text, \"产品描述 / 原始卖点\") or _section(text, \"产品描述\"\
          ) or _section(text, \"原始卖点\"),\n        \"keywords\": _section(text, \"核心关键词\") or _section(text, \"关键词\"),\n  \
          \      \"target_audience\": _section(text, \"目标人群\") or _section(text, \"受众\"),\n        \"platforms\": _section(text,\
          \ \"平台列表\") or _section(text, \"平台\"),\n        \"brand_strategy_mode\": _section(text, \"品牌策略模式\") or _section(text,\
          \ \"品牌模式\") or _section(text, \"策略模式\"),\n    }\n    specs = _section(text, \"已核实商品参数 JSON\") or _section(text,\
          \ \"已核实商品参数\")\n    parsed_specs = _parse_json(specs)\n    if parsed_specs:\n        data[\"verified_facts\"] =\
          \ parsed_specs\n    # Fallback for the old 5-line test format.\n    lines = [line.strip() for line in text.splitlines()\
          \ if line.strip() and not line.strip().startswith(\"【\")]\n    if not any(data.values()) and len(lines) >= 4:\n\
          \        data.update({\n            \"product_name\": lines[0],\n            \"product_desc\": lines[1],\n     \
          \       \"keywords\": lines[2],\n            \"target_audience\": lines[3],\n            \"platforms\": \"\".join(lines[4:])\
          \ if len(lines) > 4 else \"\",\n        })\n    return data\n\ndef main(extracted_json: str, product_name: str =\
          \ \"\", product_desc: str = \"\",\n         keywords: str = \"\", target_audience: str = \"\", platforms: str =\
          \ \"\",\n         verified_specs_json: str = \"\", document_text: str = \"\", brand_strategy_mode: str = \"auto\"\
          ):\n    data = _parse_json(extracted_json)\n    file_data = _file_data(document_text)\n    data = {**file_data,\
          \ **data}\n    manual_facts = _flatten_facts(_parse_json(verified_specs_json))\n    extracted_facts = _flatten_facts(data.get(\"\
          verified_facts\"))\n    facts = {**extracted_facts, **manual_facts}\n    allowed_brand = _allowed_brand(facts)\n\
          \n    normalized = {\n        \"product_name\": _clean(product_name) or _clean(data.get(\"product_name\")),\n  \
          \      \"product_desc\": _clean(product_desc) or _clean(data.get(\"product_desc\")),\n        \"keywords\": _clean(keywords)\
          \ or _clean(data.get(\"keywords\")),\n        \"target_audience\": _clean(target_audience) or _clean(data.get(\"\
          target_audience\")),\n        \"platforms\": _clean(platforms) or _clean(data.get(\"platforms\")) or DEFAULT_PLATFORMS,\n\
          \        \"verified_facts\": _facts_to_text(facts),\n        \"source_numbers\": _source_numbers(product_name, product_desc,\
          \ keywords, target_audience, verified_specs_json, document_text, json.dumps(data, ensure_ascii=False)),\n      \
          \  \"allowed_brand\": allowed_brand,\n        \"brand_strategy_mode\": (_clean(brand_strategy_mode) or _clean(data.get(\"\
          brand_strategy_mode\")) or \"auto\"),\n    }\n\n    if not normalized[\"product_name\"]:\n        normalized[\"\
          product_name\"] = \"待确认产品名称\"\n    if not normalized[\"product_desc\"]:\n        normalized[\"product_desc\"] =\
          \ \"待确认产品描述：上传文件中未识别到足够信息，请人工补充。\"\n    if not normalized[\"keywords\"]:\n        normalized[\"keywords\"] = normalized[\"\
          product_name\"]\n    if not normalized[\"target_audience\"]:\n        normalized[\"target_audience\"] = \"待确认目标人群\"\
          \n\n    return normalized"
        code_language: python3
        desc: 合并文件识别结果与手填覆盖字段
